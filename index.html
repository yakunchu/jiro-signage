<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ジロー薬局 サイネージ</title>
<style>
  /* 色は仮。正式なスライドの見た目は Claude Design（ジローブルー）で作って画像で差し込む */
  :root {
    --ai: #1f3f74;        /* 藍 */
    --ai-deep: #132a52;
    --ai-soft: #e9eef7;
    --ink: #17202e;
    --white: #ffffff;
    --mark: #f3c623;      /* 強調の黄 */
    --urgent: #b3261e;
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden; cursor: none;
    background: #000; color: var(--ink);
    font-family: "Noto Sans JP", "Noto Sans CJK JP", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  }
  /* スライドの領域は画面の上 91%（1920×1080 の画面なら 1920×983）。下 9% は時計の帯 */
  #stage { position: fixed; inset: 0 0 9vh 0; background: #000; }
  .slide {
    position: absolute; inset: 0; opacity: 0; transition: opacity 0.9s ease;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 7vw; box-sizing: border-box;
  }
  .slide.show { opacity: 1; }
  .slide.media { padding: 0; align-items: center; background: #000; }
  .slide.media img, .slide.media video { width: 100%; height: 100%; object-fit: contain; }
  .slide.media.cover img, .slide.media.cover video { object-fit: cover; }

  /* 文字スライドのテーマ */
  .theme-ai    { background: var(--ai); color: var(--white); }
  .theme-light { background: var(--ai-soft); color: var(--ai-deep); }
  .theme-urgent{ background: var(--white); color: var(--ink); border-top: 3.2vh solid var(--urgent); }
  .label {
    align-self: flex-start; font-size: 3.6vh; font-weight: 700; letter-spacing: 0.1em;
    padding: 0.5vh 1.6vh; margin-bottom: 3vh; border-radius: 0.6vh;
    background: var(--mark); color: var(--ai-deep);
  }
  .theme-urgent .label { background: var(--urgent); color: var(--white); }
  .title { font-size: 9vh; font-weight: 800; line-height: 1.25; margin: 0 0 4vh; white-space: pre-line; }
  .body  { font-size: 5.4vh; font-weight: 500; line-height: 1.6; margin: 0; padding: 0; list-style: none; }
  .body li + li { margin-top: 1.2vh; }
  .note  { font-size: 3.2vh; margin-top: 4vh; opacity: 0.8; }

  /* 下の帯（名前・一言・放送の版と取得時刻・時計） */
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; height: 9vh; box-sizing: border-box;
    display: flex; align-items: center; gap: 3vw; padding: 0 3vw;
    background: var(--ai-deep); color: var(--white); font-size: 3.6vh; white-space: nowrap;
  }
  #name { font-weight: 800; letter-spacing: 0.08em; }
  #ticker { flex: 1; overflow: hidden; text-overflow: ellipsis; opacity: 0.9; }
  #status { font-size: 2.4vh; opacity: 0.85; font-variant-numeric: tabular-nums; }
  #clock { font-variant-numeric: tabular-nums; font-weight: 700; }

  /* プレビュー用の表示（?debug=1 のときだけ） */
  #debug {
    position: fixed; top: 1vh; left: 1vh; z-index: 9; display: none;
    background: rgba(0,0,0,0.7); color: #0f0; font: 2vh/1.4 monospace; padding: 0.6vh 1vh;
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="bar"><span id="name"></span><span id="ticker"></span><span id="status"></span><span id="clock"></span></div>
<div id="debug"></div>

<script>
(() => {
  "use strict";

  // プレーヤー本体の版。playlist.json の config.player と同じにする。
  // 違っていたら、テレビは自動でページを読み直して新しいプレーヤーを取り込む。
  const PLAYER = "2026-11-07b";

  // ---- URL での確認用スイッチ（Claude がプレビューで使う。店頭では何も付けない）----
  //   ?at=2026-12-25T10:00  … その日時になったつもりで表示する
  //   ?only=slide-id        … 1枚だけ表示する
  //   ?fast=1               … 1枚3秒で回す
  //   ?debug=1              … 左上に今のスライド名と時刻を出す
  const q = new URLSearchParams(location.search);
  const atParam = q.get("at");
  const offsetMs = atParam ? (new Date(atParam).getTime() - Date.now()) : 0;
  const now = () => new Date(Date.now() + offsetMs);
  const ONLY = q.get("only");
  const FAST = q.get("fast") === "1";
  const DEBUG = q.get("debug") === "1";
  const PREVIEW = Boolean(atParam || ONLY || FAST || DEBUG);

  const DOW = "日月火水木金土";
  const CACHE_KEY = "jiro-signage-playlist";
  const RELOAD_KEY = "jiro-signage-reloaded-at";
  const DEFAULTS = { pharmacyName: "", ticker: "", version: 0, defaultSeconds: 12, refreshMinutes: 5, fetchTimeoutSeconds: 10 };
  const TYPES = ["text", "image", "video"];
  const reDate = /^\d{4}-\d{2}-\d{2}$/;
  const reTime = /^(\d{2}):(\d{2})-(\d{2}):(\d{2})$/;

  const stage = document.getElementById("stage");
  const $ = (id) => document.getElementById(id);

  let playlist = null;       // 今使っている内容
  let pending = null;        // 取り込み待ちの新しい内容（次の切り替えで反映）
  let order = [];            // 今回まわす順番
  let pos = -1;
  let timer = null;
  let lastOk = null;         // 最後に内容を取れた時刻

  const pad = (n) => String(n).padStart(2, "0");
  const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const hm = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;

  // ---- 内容の点検。おかしいスライドは飛ばし、全体が壊れていれば null（前回分で続ける）----
  function validTime(t) {
    const m = reTime.exec(t);
    if (!m) return false;
    const a = m[1] + ":" + m[2], b = m[3] + ":" + m[4];
    return +m[1] < 24 && +m[2] < 60 && +m[3] <= 24 && +m[4] < 60 && a < b; // 日をまたぐ時間帯は使えない
  }
  function validSlide(s, seen) {
    if (!s || typeof s !== "object") return false;
    if (typeof s.id !== "string" || !s.id || seen.has(s.id)) return false;
    const type = s.type || "text";
    if (!TYPES.includes(type)) return false;
    if (s.seconds !== undefined && !(typeof s.seconds === "number" && s.seconds > 0)) return false;
    if (s.from !== undefined && !reDate.test(s.from)) return false;
    if (s.until !== undefined && !reDate.test(s.until)) return false;
    if (s.from && s.until && s.from > s.until) return false;
    if (s.days !== undefined && !(typeof s.days === "string" && s.days && [...s.days].every((c) => DOW.includes(c)))) return false;
    if (s.time !== undefined && !(typeof s.time === "string" && validTime(s.time))) return false;
    if ((type === "image" || type === "video") && !(typeof s.src === "string" && s.src)) return false;
    return true;
  }
  function normalize(data) {
    if (!data || typeof data !== "object" || !Array.isArray(data.slides)) return null;
    const c = Object.assign({}, DEFAULTS, data.config && typeof data.config === "object" ? data.config : {});
    if (!(c.defaultSeconds > 0)) c.defaultSeconds = DEFAULTS.defaultSeconds;
    if (!(c.refreshMinutes >= 1)) c.refreshMinutes = DEFAULTS.refreshMinutes;
    if (!(c.fetchTimeoutSeconds > 0)) c.fetchTimeoutSeconds = DEFAULTS.fetchTimeoutSeconds;
    const seen = new Set();
    const slides = [];
    for (const s of data.slides) {
      if (validSlide(s, seen)) { seen.add(s.id); slides.push(s); }
      else console.warn("使えないスライドを飛ばしました:", s && s.id);
    }
    if (data.slides.length && !slides.length) return null; // 全部だめなら壊れているとみなす
    return { config: c, slides };
  }

  // ---- 表示してよいスライドかどうか（日付・曜日・時間帯）----
  function isActive(s, d) {
    if (s.enabled === false) return false;
    if (ONLY && s.id !== ONLY) return false;
    const day = ymd(d), t = hm(d);
    if (s.from && day < s.from) return false;
    if (s.until && day > s.until) return false;
    if (s.days && !s.days.includes(DOW[d.getDay()])) return false;
    if (s.time) {
      const [a, b] = s.time.split("-");
      if (t < a || t >= b) return false;
    }
    return true;
  }

  // ---- 順番づくり：ふつうのスライドの合間に「急ぎ」を毎回はさむ ----
  function buildOrder() {
    const d = now();
    const list = playlist.slides.filter((s) => isActive(s, d));
    const urgent = list.filter((s) => s.urgent === true);
    const normal = list.filter((s) => s.urgent !== true);
    if (!normal.length) return urgent;
    if (!urgent.length) return normal;
    return normal.flatMap((n) => [n, ...urgent]);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ---- 1枚分の画面をつくる ----
  function render(s) {
    const el = document.createElement("div");
    el.className = "slide";
    const type = s.type || "text";
    if (type === "image" || type === "video") {
      el.classList.add("media");
      if (s.fit === "cover") el.classList.add("cover");
      const m = document.createElement(type === "image" ? "img" : "video");
      if (type === "video") { m.muted = true; m.autoplay = true; m.playsInline = true; }
      m.src = s.src;
      el.appendChild(m);
      return { el, media: m };
    }
    el.classList.add("theme-" + (s.theme || (s.urgent ? "urgent" : "ai")));
    const body = Array.isArray(s.body) ? s.body : (s.body ? [s.body] : []);
    el.innerHTML =
      (s.label ? `<div class="label">${esc(s.label)}</div>` : "") +
      (s.title ? `<h1 class="title">${esc(s.title)}</h1>` : "") +
      (body.length ? `<ul class="body">${body.map((b) => `<li>${esc(b)}</li>`).join("")}</ul>` : "") +
      (s.note ? `<div class="note">${esc(s.note)}</div>` : "");
    return { el, media: null };
  }

  function seconds(s) {
    if (FAST) return 3;
    return s.seconds || playlist.config.defaultSeconds;
  }

  function retire(c) {
    c.classList.remove("show");
    const v = c.querySelector("video");
    if (v) { v.pause(); v.removeAttribute("src"); v.load(); }
    setTimeout(() => c.remove(), 1000);
  }

  // 次に出すスライド。表示する直前にも日付・時間帯を確かめる（期限切れを出さない）
  function pickNext() {
    for (let round = 0; round < 2; round++) {
      while (++pos < order.length) {
        if (isActive(order[pos], now())) return order[pos];
      }
      order = buildOrder();
      pos = -1;
    }
    return null;
  }

  // ---- 次のスライドへ ----
  function next() {
    clearTimeout(timer);
    if (pending) { playlist = pending; pending = null; applyConfig(); order = []; pos = -1; }
    const s = pickNext();
    if (!s) { showEmpty(); timer = setTimeout(next, 30000); return; }

    const { el, media } = render(s);
    let moved = false;
    const go = () => { if (!moved) { moved = true; next(); } };

    [...stage.children].forEach(retire);
    stage.appendChild(el);
    void el.offsetWidth; // 一度描かせてからフェードを始める（画面が裏に回っていても止まらない書き方）
    el.classList.add("show");

    const type = s.type || "text";
    if (type === "image") {
      // 画像は読み込めてから秒数を数える。15秒たっても読めなければ次へ
      media.addEventListener("error", () => setTimeout(go, 300));
      timer = setTimeout(go, 15000);
      const onLoad = () => { if (moved) return; clearTimeout(timer); timer = setTimeout(go, seconds(s) * 1000); };
      if (media.complete && media.naturalWidth) onLoad(); else media.addEventListener("load", onLoad, { once: true });
    } else if (type === "video") {
      // 動画は終わったら次へ。念のため上限時間も置く（最初の運用では動画は使わない）
      media.addEventListener("error", () => setTimeout(go, 300));
      media.addEventListener("ended", go);
      timer = setTimeout(go, (s.seconds || 120) * 1000);
    } else {
      timer = setTimeout(go, seconds(s) * 1000);
    }
    if (DEBUG) $("debug").textContent = `${s.id}  ${pos + 1}/${order.length}  ${ymd(now())} ${hm(now())}`;
  }

  function showEmpty() {
    [...stage.children].forEach(retire);
    const { el } = render({ id: "_empty", theme: "ai", title: playlist ? playlist.config.pharmacyName : "", body: [] });
    stage.appendChild(el); void el.offsetWidth; el.classList.add("show");
  }

  function applyConfig() {
    const c = playlist.config;
    $("name").textContent = c.pharmacyName || "";
    $("ticker").textContent = c.ticker || "";
    updateStatus();
  }

  // 帯の右に「第◯版・最後に内容を取れた時刻」を出す。開店時の目視確認用
  function updateStatus() {
    if (!playlist) return;
    const v = playlist.config.version ? `第${playlist.config.version}版` : "";
    let t = "前回の内容で表示中";
    if (lastOk) {
      const mins = (Date.now() - lastOk.getTime()) / 60000;
      t = mins > 30 ? `${hm(lastOk)}から通信なし` : `${hm(lastOk)}取得`;
    }
    $("status").textContent = [v, t].filter(Boolean).join("・");
  }

  // ---- 内容（playlist.json）の取り込み。時間制限つき。失敗したら null ----
  async function fetchPlaylist() {
    const limit = ((playlist && playlist.config.fetchTimeoutSeconds) || DEFAULTS.fetchTimeoutSeconds) * 1000;
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), limit);
    try {
      const r = await fetch("playlist.json?t=" + Date.now(), { cache: "no-store", signal: ctl.signal });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const text = await r.text();
      const data = normalize(JSON.parse(text));
      if (!data) throw new Error("内容の形式が正しくありません");
      try { localStorage.setItem(CACHE_KEY, text); } catch (e) { /* 保存できなくても続ける */ }
      lastOk = new Date();
      return data;
    } catch (e) {
      console.warn("playlist.json を使えませんでした（前回分で続けます）:", e.message);
      return null;
    } finally {
      clearTimeout(t);
    }
  }

  function cachedPlaylist() {
    try { const t = localStorage.getItem(CACHE_KEY); return t ? normalize(JSON.parse(t)) : null; } catch (e) { return null; }
  }

  // プレーヤー本体が新しくなっていたら読み直す。古い版が配られている間に何度も読み直さないよう10分あける
  function checkPlayer(p) {
    const want = p.config.player;
    if (!want || want === PLAYER || PREVIEW) return;
    let last = 0;
    try { last = Number(localStorage.getItem(RELOAD_KEY)) || 0; } catch (e) { /* なし */ }
    if (Date.now() - last < 10 * 60 * 1000) return;
    try { localStorage.setItem(RELOAD_KEY, String(Date.now())); } catch (e) { /* なし */ }
    location.replace(location.pathname + "?v=" + encodeURIComponent(want));
  }

  let refreshing = false;
  async function refresh() {
    if (refreshing) return;
    refreshing = true;
    const data = await fetchPlaylist();
    refreshing = false;
    updateStatus();
    if (!data) return;
    checkPlayer(data);
    if (JSON.stringify(data) !== JSON.stringify(playlist)) pending = data;
  }

  function scheduleRefresh() {
    setTimeout(async () => { await refresh(); scheduleRefresh(); }, playlist.config.refreshMinutes * 60 * 1000);
  }

  function tick() {
    const d = now();
    $("clock").textContent = `${d.getMonth() + 1}月${d.getDate()}日（${DOW[d.getDay()]}）${hm(d)}`;
    updateStatus();
  }

  async function start() {
    if (DEBUG) $("debug").style.display = "block";
    // 1) 保存してある前回分があれば、通信を待たずにすぐ流し始める
    playlist = cachedPlaylist();
    if (playlist) { applyConfig(); next(); }
    // 2) 新しい内容を取りに行く（時間制限つき）
    const fresh = await fetchPlaylist();
    if (fresh) {
      checkPlayer(fresh);
      if (!playlist) { playlist = fresh; applyConfig(); next(); }
      else if (JSON.stringify(fresh) !== JSON.stringify(playlist)) pending = fresh;
    }
    if (!playlist) { playlist = { config: Object.assign({}, DEFAULTS, { refreshMinutes: 1 }), slides: [] }; applyConfig(); next(); }
    tick();
    setInterval(tick, 15000);
    scheduleRefresh();
    // テレビがスタンバイから戻ったときなど、画面が表に出たらすぐ内容を確かめる
    document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
  }

  start();
})();
</script>
</body>
</html>
